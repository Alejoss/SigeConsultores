services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    env_file:
      - .env.production
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # Mismo volumen que docker-compose.staging.yml (sige-app-staging_mysql_staging_data en el droplet).
      # No usar mysql_data: se creó vacío el 2026-05-20 al migrar a prod compose.
      - mysql_staging_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      # Producción: las migraciones se aplican de forma controlada y aditiva.
      # No ejecutar un push --force general sobre los registros empresariales.
      RUN_DB_PUSH_ON_STARTUP: "false"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # Host :3001 = Nginx en el droplet (staging histórico). Contenedor sigue en :3000.
      - "127.0.0.1:3001:3000"

volumes:
  mysql_staging_data:
