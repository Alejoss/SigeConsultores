services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    env_file:
      - .env.staging
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_staging_data:/var/lib/mysql
    # MYSQL_PWD evita que caracteres especiales en la contraseña rompan el shell del healthcheck.
    # start_period: en este droplet MySQL tarda ~6 min en "ready for connections" tras recovery/InnoDB.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "export MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" && mysqladmin ping -h 127.0.0.1 -uroot || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 420s
    ports:
      - "127.0.0.1:3307:3306"

  app:
    image: ${APP_IMAGE:-sige-staging:local}
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      # Schema changes: run once per deploy (see scripts/staging-db-migrate.sh), not on every container restart.
      RUN_DB_PUSH_ON_STARTUP: "false"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  mysql_staging_data:
