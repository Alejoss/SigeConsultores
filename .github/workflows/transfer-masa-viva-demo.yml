---
name: Transferir datos demostrativos de Masa Viva

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Escriba TRANSFERIR-MASA-VIVA para ejecutar la copia transaccional.
        required: true
        type: string

concurrency:
  group: transfer-masa-viva-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-deploy-secrets:
    name: Validar acceso seguro al servidor
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          DROPLET_HOST: ${{ vars.DROPLET_HOST || secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ vars.DROPLET_USER || secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$DROPLET_HOST" ] && [ -n "$DROPLET_USER" ] && [ -n "$DROPLET_SSH_KEY" ] && [ -n "$DEPLOY_PATH" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  transfer:
    name: Respaldar y transferir exclusivamente Masa Viva
    needs: check-deploy-secrets
    if: needs.check-deploy-secrets.outputs.ready == 'true' && inputs.confirmation == 'TRANSFERIR-MASA-VIVA'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obtener procedimiento validado
        uses: actions/checkout@v4

      - name: Prevalidar, respaldar y transferir
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
          REPO_SLUG: ${{ github.repository }}
        with:
          host: ${{ vars.DROPLET_HOST || secrets.DROPLET_HOST }}
          username: ${{ vars.DROPLET_USER || secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_PATH,DEPLOY_SHA,REPO_SLUG
          script: |
            set -eu
            DEPLOY_PATH="${DEPLOY_PATH%/}"
            cd "$DEPLOY_PATH"
            test -f .env.production
            test -f docker-compose.prod.yml

            # El script y el paquete son exclusivamente los del commit que se activó.
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$DEPLOY_SHA"
            git reset --hard "$DEPLOY_SHA"

            COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env.production"
            APP_ID="$($COMPOSE ps -q app)"
            test -n "$APP_ID"
            $COMPOSE exec -T app sh -c 'test -d /app/node_modules'

            # Se copian al contenedor activo; la imagen de la aplicación y los
            # datos productivos no se reconstruyen ni se sustituyen en este paso.
            docker cp scripts/transfer-masa-viva-demo-to-production.mjs "$APP_ID:/app/transfer-masa-viva-demo-to-production.mjs"
            docker cp scripts/data/masa-viva-demo-payload-2026-09-24.json "$APP_ID:/app/masa-viva-demo-payload-2026-09-24.json"
            trap 'docker exec "$APP_ID" rm -f /app/transfer-masa-viva-demo-to-production.mjs /app/masa-viva-demo-payload-2026-09-24.json' EXIT

            echo '--- Prevalidación sin escritura ---'
            $COMPOSE exec -T -e ALLOW_MASA_VIVA_PRODUCTION_TRANSFER=true app \
              node /app/transfer-masa-viva-demo-to-production.mjs \
              --payload=/app/masa-viva-demo-payload-2026-09-24.json --preflight

            echo '--- Respaldo completo inmediatamente antes de la transferencia ---'
            bash scripts/backup-cron.sh

            echo '--- Transferencia transaccional de Masa Viva ---'
            $COMPOSE exec -T -e ALLOW_MASA_VIVA_PRODUCTION_TRANSFER=true app \
              node /app/transfer-masa-viva-demo-to-production.mjs \
              --payload=/app/masa-viva-demo-payload-2026-09-24.json --execute

            echo '--- Verificación HTTP de la aplicación existente ---'
            curl -fsS --max-time 20 http://127.0.0.1:3001/ >/dev/null

  blocked:
    name: Transferencia bloqueada
    needs: check-deploy-secrets
    if: needs.check-deploy-secrets.outputs.ready != 'true' || inputs.confirmation != 'TRANSFERIR-MASA-VIVA'
    runs-on: ubuntu-latest
    steps:
      - name: Informar bloqueo seguro
        run: |
          echo "La transferencia no se ejecutó. Revise los secretos de despliegue y la confirmación exacta."
