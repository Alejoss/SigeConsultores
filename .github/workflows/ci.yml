name: CI

on:
  pull_request:
    branches:
      - main
      - infra/staging-cicd
  push:
    branches:
      - main
      - infra/staging-cicd

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      # Tests need MySQL locally; run with `pnpm test` before push when you touch server code.
      # See docs/GITHUB_SETUP.md to enable tests in CI later.
