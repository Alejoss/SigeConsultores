name: Deploy Staging

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:staging-latest
            ghcr.io/${{ github.repository }}:staging-${{ github.sha }}

      - name: Copy deploy files to staging droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST_STAGING }}
          username: ${{ secrets.DROPLET_USER_STAGING }}
          key: ${{ secrets.DROPLET_SSH_KEY_STAGING }}
          source: docker-compose.staging.yml,scripts/deploy-staging.sh
          target: ${{ secrets.DEPLOY_PATH_STAGING }}
          strip_components: 0

      - name: Run deploy script on staging droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME_STAGING }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN_STAGING }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_STAGING }}
          ENV_STAGING: ${{ secrets.ENV_STAGING }}
        with:
          host: ${{ secrets.DROPLET_HOST_STAGING }}
          username: ${{ secrets.DROPLET_USER_STAGING }}
          key: ${{ secrets.DROPLET_SSH_KEY_STAGING }}
          script_stop: true
          envs: APP_IMAGE,GHCR_USERNAME,GHCR_TOKEN,DEPLOY_PATH,ENV_STAGING
          script: |
            set -eu
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            printf "%s" "$ENV_STAGING" > .env.staging
            chmod +x scripts/deploy-staging.sh
            ./scripts/deploy-staging.sh
