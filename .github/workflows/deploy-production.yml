name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy-droplet:
    name: Deploy to droplet (requires secrets)
    needs: build-image
    runs-on: ubuntu-latest
    if: >-
      ${{ secrets.DROPLET_HOST != '' &&
          secrets.DROPLET_USER != '' &&
          secrets.DROPLET_SSH_KEY != '' &&
          secrets.DEPLOY_PATH != '' &&
          secrets.ENV_PRODUCTION != '' &&
          secrets.GHCR_USERNAME != '' &&
          secrets.GHCR_TOKEN != '' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose and deploy script to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: docker-compose.prod.yml,scripts/deploy-prod.sh
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0

      - name: Run deploy script on droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          envs: APP_IMAGE,GHCR_USERNAME,GHCR_TOKEN,DEPLOY_PATH,ENV_PRODUCTION
          script: |
            set -eu
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            printf "%s" "$ENV_PRODUCTION" > .env.production
            chmod +x scripts/deploy-prod.sh
            ./scripts/deploy-prod.sh

  deploy-skipped-hint:
    name: Deploy skipped (configure secrets)
    needs: build-image
    runs-on: ubuntu-latest
    if: >-
      ${{ always() &&
          needs.build-image.result == 'success' &&
          (secrets.DROPLET_HOST == '' ||
           secrets.DROPLET_SSH_KEY == '' ||
           secrets.ENV_PRODUCTION == '' ||
           secrets.GHCR_TOKEN == '') }}
    steps:
      - name: Note
        run: |
          echo "Image pushed to GHCR. Droplet deploy skipped — add GitHub Actions secrets (see docs/GITHUB_SETUP.md)."
          echo "Manual deploy on server: git pull && docker build && compose up (see docs/DEPLOYMENT.md)."
