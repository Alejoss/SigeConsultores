name: Deploy Production

# CD MUST wait for CI: never deploy a commit whose tests/typecheck/build failed.
# Triggered only after the CI workflow completes on main (push/merge).
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: deploy-production-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  # Resolve the commit to deploy and refuse to continue if CI did not succeed.
  gate:
    name: Gate (CI must be green)
    runs-on: ubuntu-latest
    # Skip quietly for CI runs that are not a push to main (e.g. pull_request).
    # Still run (and fail hard) when CI failed on a push to main.
    if: github.event.workflow_run.event == 'push'
    outputs:
      deploy_sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Require successful CI
        id: sha
        run: |
          set -euo pipefail
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          EVENT="${{ github.event.workflow_run.event }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          RUN_URL="${{ github.event.workflow_run.html_url }}"

          echo "CI run: $RUN_URL"
          echo "CI event=$EVENT branch=$BRANCH sha=$SHA conclusion=$CONCLUSION"

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI did not succeed (conclusion=$CONCLUSION). Deploy aborted — production stays on the previous release."
            exit 1
          fi

          if [ -z "$SHA" ]; then
            echo "::error::Missing workflow_run.head_sha"
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build-image:
    name: Build and push image
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_name: ${{ steps.image.outputs.name }}
      deploy_sha: ${{ needs.gate.outputs.deploy_sha }}

    steps:
      - name: Checkout deploy commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.deploy_sha }}

      - name: Set GHCR image name (lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ needs.gate.outputs.deploy_sha }}

  check-deploy-secrets:
    name: Check deploy secrets
    needs: build-image
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          DROPLET_HOST: ${{ vars.DROPLET_HOST || secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ vars.DROPLET_USER || secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -n "$DROPLET_HOST" ] && [ -n "$DROPLET_USER" ] && [ -n "$DROPLET_SSH_KEY" ] && \
             [ -n "$DEPLOY_PATH" ] && [ -n "$ENV_PRODUCTION" ] && [ -n "$GHCR_USERNAME" ] && [ -n "$GHCR_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-droplet:
    name: Deploy to droplet
    needs: [gate, build-image, check-deploy-secrets]
    runs-on: ubuntu-latest
    if: needs.check-deploy-secrets.outputs.ready == 'true'
    timeout-minutes: 20

    steps:
      - name: Deploy on droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ needs.build-image.outputs.image_name }}:${{ needs.gate.outputs.deploy_sha }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
          DEPLOY_SHA: ${{ needs.gate.outputs.deploy_sha }}
          REPO_SLUG: ${{ github.repository }}
        with:
          host: ${{ vars.DROPLET_HOST || secrets.DROPLET_HOST }}
          username: ${{ vars.DROPLET_USER || secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          envs: APP_IMAGE,GHCR_USERNAME,GHCR_TOKEN,DEPLOY_PATH,ENV_PRODUCTION,DEPLOY_SHA,REPO_SLUG
          script: |
            set -eu
            DEPLOY_PATH="${DEPLOY_PATH%/}"
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            ORIGIN_AUTH="https://${GHCR_USERNAME}:${GHCR_TOKEN}@github.com/${REPO_SLUG}.git"
            ORIGIN_PUBLIC="https://github.com/${REPO_SLUG}.git"

            if [ ! -d .git ]; then
              echo "No .git at ${DEPLOY_PATH}; bootstrapping repository..."
              if [ -z "$(ls -A 2>/dev/null || true)" ]; then
                git clone -b main "$ORIGIN_AUTH" .
              else
                git init
                git remote add origin "$ORIGIN_AUTH"
              fi
            fi

            git remote set-url origin "$ORIGIN_AUTH"
            git fetch origin main
            git reset --hard "$DEPLOY_SHA"
            git remote set-url origin "$ORIGIN_PUBLIC"

            printf '%s\n' "$ENV_PRODUCTION" > .env.production
            chmod +x scripts/deploy-prod.sh
            ./scripts/deploy-prod.sh

  deploy-skipped-hint:
    name: Deploy skipped (configure secrets)
    needs: check-deploy-secrets
    runs-on: ubuntu-latest
    if: needs.check-deploy-secrets.outputs.ready != 'true'
    steps:
      - name: Note
        run: |
          echo "Image pushed to GHCR. Droplet deploy skipped — add GitHub Actions secrets (see docs/GITHUB_SETUP.md)."
