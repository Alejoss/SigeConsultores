name: Deploy Production

# Reusable CD: ci.yml calls this workflow only after every CI job succeeds.
on:
  workflow_call:

concurrency:
  group: deploy-production-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_name: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set GHCR image name (lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  check-deploy-secrets:
    name: Check deploy secrets
    needs: build-image
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          DROPLET_HOST: ${{ vars.DROPLET_HOST || secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ vars.DROPLET_USER || secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -n "$DROPLET_HOST" ] && [ -n "$DROPLET_USER" ] && [ -n "$DROPLET_SSH_KEY" ] && \
             [ -n "$DEPLOY_PATH" ] && [ -n "$ENV_PRODUCTION" ] && [ -n "$GHCR_USERNAME" ] && [ -n "$GHCR_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-droplet:
    name: Deploy to droplet
    needs: [build-image, check-deploy-secrets]
    runs-on: ubuntu-latest
    if: needs.check-deploy-secrets.outputs.ready == 'true'
    timeout-minutes: 20

    steps:
      - name: Deploy on droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ needs.build-image.outputs.image_name }}:${{ github.sha }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
          DEPLOY_SHA: ${{ github.sha }}
          REPO_SLUG: ${{ github.repository }}
        with:
          host: ${{ vars.DROPLET_HOST || secrets.DROPLET_HOST }}
          username: ${{ vars.DROPLET_USER || secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          envs: APP_IMAGE,GHCR_USERNAME,GHCR_TOKEN,DEPLOY_PATH,ENV_PRODUCTION,DEPLOY_SHA,REPO_SLUG
          script: |
            set -eu
            DEPLOY_PATH="${DEPLOY_PATH%/}"
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            ORIGIN_AUTH="https://${GHCR_USERNAME}:${GHCR_TOKEN}@github.com/${REPO_SLUG}.git"
            ORIGIN_PUBLIC="https://github.com/${REPO_SLUG}.git"

            if [ ! -d .git ]; then
              echo "No .git at ${DEPLOY_PATH}; bootstrapping repository..."
              if [ -z "$(ls -A 2>/dev/null || true)" ]; then
                git clone -b main "$ORIGIN_AUTH" .
              else
                git init
                git remote add origin "$ORIGIN_AUTH"
              fi
            fi

            git remote set-url origin "$ORIGIN_AUTH"
            git fetch origin main
            git reset --hard "$DEPLOY_SHA"
            git remote set-url origin "$ORIGIN_PUBLIC"

            printf '%s\n' "$ENV_PRODUCTION" > .env.production
            chmod +x scripts/deploy-prod.sh
            ./scripts/deploy-prod.sh

  deploy-skipped-hint:
    name: Deploy skipped (configure secrets)
    needs: check-deploy-secrets
    runs-on: ubuntu-latest
    if: needs.check-deploy-secrets.outputs.ready != 'true'
    steps:
      - name: Note
        run: |
          echo "Image pushed to GHCR. Droplet deploy skipped — add GitHub Actions secrets (see docs/GITHUB_SETUP.md)."
